<!DOCTYPE html>
<html lang="mr" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - बणजारा विरासत संघ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { maroon: { 700: '#7b1113', 800: '#5c0c0e', 900: '#400809' } },
                    fontFamily: { sans: ['Poppins', 'sans-serif'] }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-100 min-h-full font-sans text-gray-800 flex flex-col justify-between">

    <!-- Header -->
    <header class="bg-maroon-900 text-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <span class="text-2xl">🏛️</span>
                <div>
                    <h1 class="font-bold text-base">बणजारा विरासत संघ - Admin Dashboard</h1>
                    <p class="text-xs text-yellow-300">Total Registrations Management & Sorting</p>
                </div>
            </div>
            <a href="index.html" class="bg-yellow-500 hover:bg-yellow-600 text-maroon-900 font-bold px-4 py-2 rounded-lg text-xs shadow transition">
                <i class="fa-solid fa-arrow-left mr-1"></i> मुख्य फॉर्मवर जा (Back to Portal)
            </a>
        </div>
    </header>

    <!-- Dashboard Content -->
    <main class="max-w-7xl mx-auto px-4 py-8 w-full flex-grow">
        <div class="bg-white p-4 rounded-2xl shadow-md mb-6 flex flex-wrap items-center justify-between gap-4">
            <div class="flex items-center space-x-2">
                <span class="font-bold text-maroon-900 text-lg"><i class="fa-solid fa-users mr-2"></i> एकूण नोंदणी: <span id="total_count">0</span></span>
            </div>
            <div class="flex flex-wrap items-center gap-3">
                <input type="text" id="search_query" onkeyup="loadAdminDashboard()" placeholder="नाव किंवा मोबाईल शोधा..." class="px-3 py-2 border rounded-xl text-xs focus:ring-2 focus:ring-maroon-700 outline-none">
                <select id="sort_by" onchange="loadAdminDashboard()" class="px-3 py-2 border rounded-xl text-xs font-semibold bg-gray-50">
                    <option value="newest">Sort: नवीन आधी (Newest)</option>
                    <option value="name">Sort: नाव (Name A-Z)</option>
                    <option value="dob">Sort: वय/जन्मतारीख (DOB)</option>
                </select>
                <select id="filter_gender" onchange="loadAdminDashboard()" class="px-3 py-2 border rounded-xl text-xs font-semibold bg-gray-50">
                    <option value="">सर्व लिंग (All Genders)</option>
                    <option value="पुरुष">पुरुष</option>
                    <option value="महिला">महिला</option>
                    <option value="इतर">इतर</option>
                </select>
            </div>
        </div>

        <!-- Table View -->
        <div class="bg-white rounded-2xl shadow-xl overflow-hidden border border-gray-200">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse text-sm">
                    <thead>
                        <tr class="bg-maroon-900 text-white text-xs">
                            <th class="p-4">फोटो</th>
                            <th class="p-4">नाव (Full Name)</th>
                            <th class="p-4">मोबाइल (Mobile)</th>
                            <th class="p-4">लिंग / रक्तगट</th>
                            <th class="p-4">जिल्हा / तालुका</th>
                            <th class="p-4">ओळखपत्र (ID Proof & Doc)</th>
                            <th class="p-4">नोंदणी तारीख</th>
                        </tr>
                    </thead>
                    <tbody id="admin-table-body" class="divide-y divide-gray-200">
                        <!-- Populated via Supabase -->
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <footer class="bg-maroon-900 text-white text-center py-4 text-xs mt-8">
        <p>© 2026 बणजारा विरासत संघ. Admin Control Panel.</p>
    </footer>

    <!-- Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = 'https://yxnsapsavyueubvfczgg.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl4bnNhcHNhdnl1ZXVidmZjemdnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEzNTY2ODMsImV4cCI6MjEwNjkzMjY4M30.ql0bNjzlYmXPtcXo_YcZAp8YiOpjsJyV2bZoAzxfrQg';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        window.onload = () => { loadAdminDashboard(); };

        async function loadAdminDashboard() {
            const sortBy = document.getElementById('sort_by').value;
            const filterGender = document.getElementById('filter_gender').value;
            const searchQuery = document.getElementById('search_query').value.trim();

            let query = supabaseClient.from('members').select('*', { count: 'exact' });

            if(filterGender) query = query.eq('gender', filterGender);
            if(searchQuery) query = query.or(`full_name.ilike.%${searchQuery}%,mobile_number.ilike.%${searchQuery}%`);

            if(sortBy === 'name') query = query.order('full_name', { ascending: true });
            else if(sortBy === 'dob') query = query.order('dob', { ascending: false });
            else query = query.order('created_at', { ascending: false });

            const { data, count } = await query;
            if(count !== null) document.getElementById('total_count').innerText = count;

            const tbody = document.getElementById('admin-table-body');
            tbody.innerHTML = '';

            if(data && data.length > 0) {
                data.forEach(m => {
                    const dateStr = new Date(m.created_at).toLocaleDateString('en-IN');
                    const docLink = m.id_proof_url ? `<a href="${m.id_proof_url}" target="_blank" class="text-blue-600 underline hover:text-blue-800 font-semibold"><i class="fa-solid fa-file-image mr-1"></i> View Doc</a>` : '<span class="text-gray-400">No Doc</span>';
                    
                    tbody.innerHTML += `
                        <tr class="hover:bg-gray-50">
                            <td class="p-3">
                                <img src="${m.photo_url || 'https://via.placeholder.com/150'}" class="w-10 h-10 rounded-full object-cover border border-maroon-700">
                            </td>
                            <td class="p-3 font-bold text-maroon-900">${m.full_name}</td>
                            <td class="p-3">${m.mobile_number}</td>
                            <td class="p-3">${m.gender} / <span class="text-red-600 font-bold">${m.blood_group || 'N/A'}</span></td>
                            <td class="p-3">${m.district}, ${m.taluka}</td>
                            <td class="p-3 text-xs">
                                <span class="bg-amber-100 text-amber-800 px-2 py-1 rounded font-medium block mb-1">${m.id_proof_type}: ${m.id_proof_number}</span>
                                ${docLink}
                            </td>
                            <td class="p-3 text-xs text-gray-500">${dateStr}</td>
                        </tr>
                    `;
                });
            } else {
                tbody.innerHTML = `<tr><td colspan="7" class="p-6 text-center text-gray-500">कोणतीही नोंद आढळली नाही.</td></tr>`;
            }
        }
    </script>
</body>
</html>
